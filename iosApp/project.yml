# Generates Trip.xcodeproj: `xcodegen` in this folder. The generated project is committed, so building
# needs only Xcode; regenerate after changing this file.
name: Trip
options:
  deploymentTarget:
    iOS: "17.0"
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    TARGETED_DEVICE_FAMILY: "1"
    # The Kotlin framework is built for Apple silicon only (iosArm64, iosSimulatorArm64).
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
targets:
  Trip:
    type: application
    platform: iOS
    sources: [App, Shared]
    settings:
      base:
        PRODUCT_NAME: Trip
        PRODUCT_BUNDLE_IDENTIFIER: $(TRIP_BUNDLE_ID)
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/App.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS: [-framework, Shared]
    preBuildScripts:
      - name: Kotlin
        basedOnDependencyAnalysis: false
        script: |
          # Builds the shared Kotlin framework (app and trip) for this Xcode build.
          cd "$SRCROOT/.."
          [ -n "$JAVA_HOME" ] || for j in /opt/homebrew/opt/openjdk@17 /usr/local/opt/openjdk@17 "/Applications/Android Studio.app/Contents/jbr/Contents/Home"; do
            [ -x "$j/bin/java" ] && export JAVA_HOME="$j" && break
          done
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode -PtripDir="$TRIP_DIR"
    dependencies:
      - target: Widgets
  Widgets:
    type: app-extension
    platform: iOS
    sources: [Widgets, Shared]
    settings:
      base:
        PRODUCT_NAME: Widgets
        PRODUCT_BUNDLE_IDENTIFIER: $(TRIP_BUNDLE_ID).widgets
        INFOPLIST_FILE: Widgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: Widgets/Widgets.entitlements
